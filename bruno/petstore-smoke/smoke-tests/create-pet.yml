id: create-pet

info:
  name: Create Pet
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/pet"

  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json

  body:
    type: json
    data: |-
      {
        "id": {{petId}},
        "category": {
          "id": 1,
          "name": "automation"
        },
        "name": "Bruno_Automation_Pet",
        "photoUrls": [
          "https://example.com/pet.jpg"
        ],
        "tags": [
          {
            "id": 1,
            "name": "automation"
          }
        ],
        "status": "available"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const petId = Math.floor(
          Math.random() * 900000000
        ) + 100000000;

        bru.setVar("petId", String(petId));

        console.log("Generated Pet ID:", petId);
        console.log("Stored Pet ID:", bru.getVar("petId"));

    - type: tests
      code: |-
        test("Response status should be 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Response should contain pet id", function() {
          expect(res.body).to.have.property("id");
        });

        test("Response should contain pet name", function() {
          expect(res.body).to.have.property("name");
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true