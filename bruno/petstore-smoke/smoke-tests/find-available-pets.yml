info:
  name: Find Available Pets
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/pet/findByStatus"
  params:
    - name: status
      value: available
  headers:
    - name: accept
      value: application/json

runtime:
  scripts:
    - type: tests
      code: |-
        test("Response status should be 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Response body should be an array", function() {
          expect(res.body).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
