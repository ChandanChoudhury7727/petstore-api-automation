id: get-created-pet

info:
  name: Get Created Pet
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/pet/{{petId}}"

  headers:
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: tests
      code: |-
        test("Response status should be 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Response should contain pet id", function() {
          expect(res.body).to.have.property("id");
        });

        test("Response should contain pet name", function() {
          expect(res.body).to.have.property("name");
        });

        test("Response should contain expected pet name", function() {
          expect(res.body.name).to.equal("Bruno_Automation_Pet");
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true